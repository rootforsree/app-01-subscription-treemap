# Shared detekt config for the template (detekt 1.23.x).
# Fails the build on the skill's ban list: !!, GlobalScope, forbidden comments.

config:
  validation: true
  warningsAsErrors: true

build:
  maxIssues: 0
  excludeCorrectable: false

comments:
  active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
  LargeClass:
    active: true
    threshold: 600
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true

potential-bugs:
  active: true
  # The skill bans !! in production code (tests only).
  UnsafeCallOnNullableType:
    active: true

naming:
  active: true
  FunctionNaming:
    active: false
    # Disabled: Compose requires Uppercase function names, conflicts with this rule.
  PackageNaming:
    active: false
    # Disabled: app package names contain underscores/numbers (e.g. app_01_subscription_treemap).
  MatchingDeclarationName:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    comments:
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 2
    excludedFunctions: ['equals']
